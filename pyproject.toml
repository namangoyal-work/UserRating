[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "userating"
version = "1.0.0"
description = "Turn free-text user feedback into 1-5 star ratings with a stacked classical-NLP ensemble."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Naman Goyal" }]
requires-python = ">=3.9"
keywords = ["nlp", "sentiment-analysis", "text-classification", "ratings", "xgboost"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "nltk",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
userating = "userating.cli:main"

[project.urls]
Homepage = "https://github.com/namangoyal-work/UserRating"
Issues = "https://github.com/namangoyal-work/UserRating/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
# notebooks are exploratory artifacts; 2024EE30913 is the frozen course submission
extend-exclude = ["notebooks", "2024EE30913"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E741: single-letter names (l) are house style here; B023: closures in the
# feature pipeline intentionally bind loop state
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
